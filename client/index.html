    <!-- Home page follows the visitor's time of day: dark from 19:00 to 07:00 -->
    <script>
      (function () {
        var h = new Date().getHours();
        if (location.pathname === "/" && (h < 7 || h >= 19)) document.documentElement.classList.add("dark");

    </script>
